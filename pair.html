<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Connect this phone</title>
<link rel="stylesheet" href="/app.css">
<style>
  .pair { position: relative; z-index: 1; max-width: 420px; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 18px;
          padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); }
  .pair h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .pair p { margin: 0; color: var(--muted); line-height: 1.45; }
  .pair form { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 26px; background: var(--glass); border: 1px solid var(--line); }
  .pair label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 650; color: var(--muted); }
  .pair input { height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--text); font: inherit; font-size: 17px; }
  .pair input.code { font-size: 30px; font-weight: 700; letter-spacing: 0.35em; text-align: center; font-variant-numeric: tabular-nums; }
  .pair .accent-btn { height: 52px; font-size: 16px; }
  .pair .error { color: var(--danger); min-height: 1.3em; font-size: 14px; }
  .pair .how { font-size: 14px; }
  .pair .ios-first { padding: 14px 16px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--text); }
  .lockmark { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
  .lockmark svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i id="glow-a"></i><i id="glow-b"></i><i id="glow-c"></i></div>
<main class="pair">
  <span class="lockmark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg></span>
  <h1>This phone isn't connected to the home yet</h1>
  <p>On a phone that already has the remote, open TV controls → Remote settings → Phones → Add a phone. Type the code it shows here.</p>
  <p class="ios-first" id="ios-first" hidden>On iPhone, first tap Share → Add to Home Screen, then open the remote from your Home Screen and enter the code there.</p>
  <form id="pair-form" autocomplete="off">
    <label>Code<input class="code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" required></label>
    <label>Whose phone is this?<input id="name" maxlength="40" placeholder="VJS's phone" required></label>
    <p class="error" id="error" role="alert"></p>
    <button class="accent-btn" type="submit">Connect this phone</button>
  </form>
</main>
<script src="/pair.js"></script>
</body>
</html>
